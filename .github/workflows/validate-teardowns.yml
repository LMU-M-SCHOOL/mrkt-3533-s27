name: Validate teardowns

on:
  pull_request:
    paths:
      - "taste/archive/**"
      - "tools/taste/**"
      - "tests/taste/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m tools.taste.validate_all taste/archive
      - run: pytest tests/taste -q
